<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#128C7E">
    <title>WhatsChat - Mensajería Instantánea</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <!-- Pantalla de Autenticación -->
    <div id="authScreen" class="screen active">
        <div class="auth-container">
            <div class="app-header">
                <div class="logo">
                    <i class="fab fa-whatsapp"></i>
                    <h1>WhatsChat</h1>
                </div>
                <p class="subtitle">Mensajería en tiempo real</p>
            </div>
            
            <div class="auth-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="displayName" placeholder="Tu nombre" maxlength="20">
                </div>
                
                <div class="input-group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="phoneNumber" placeholder="Número de teléfono" pattern="[0-9]{10}">
                </div>
                
                <div class="input-group">
                    <i class="fas fa-camera"></i>
                    <input type="file" id="profilePhoto" accept="image/*" style="display: none;">
                    <button id="uploadPhotoBtn" class="photo-btn">
                        <i class="fas fa-plus"></i> Foto de perfil
                    </button>
                    <div id="photoPreview"></div>
                </div>
                
                <button id="signInBtn" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Ingresar al Chat
                </button>
                
                <div class="auth-footer">
                    <p>Al registrarte, aceptas nuestros <a href="#">Términos y Privacidad</a></p>
                </div>
            </div>
            
            <div class="demo-users">
                <h3>Usuarios de prueba:</h3>
                <div class="demo-buttons">
                    <button class="demo-btn" data-user="Ana">👩 Ana</button>
                    <button class="demo-btn" data-user="Carlos">👨 Carlos</button>
                    <button class="demo-btn" data-user="Maria">👩 María</button>
                    <button class="demo-btn" data-user="Juan">👨 Juan</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Pantalla Principal de Chat -->
    <div id="chatScreen" class="screen">
        <!-- Encabezado -->
        <header class="chat-header">
            <button class="back-btn" id="backBtn">
                <i class="fas fa-arrow-left"></i>
            </button>
            
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-details">
                    <h2 id="currentUserName">Usuario</h2>
                    <p id="userStatus">En línea</p>
                </div>
            </div>
            
            <div class="header-actions">
                <button class="header-btn" id="videoCallBtn">
                    <i class="fas fa-video"></i>
                </button>
                <button class="header-btn" id="audioCallBtn">
                    <i class="fas fa-phone"></i>
                </button>
                <button class="header-btn" id="menuBtn">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </header>
        
        <!-- Lista de Chats -->
        <div class="chats-container" id="chatsList">
            <div class="search-bar">
                <i class="fas fa-search"></i>
                <input type="text" id="searchChats" placeholder="Buscar chats...">
            </div>
            
            <div class="chats-list" id="chatsContainer">
                <!-- Los chats se cargarán aquí dinámicamente -->
                <div class="no-chats" id="noChats">
                    <i class="fas fa-comments"></i>
                    <p>No hay chats activos</p>
                    <button class="btn-secondary" id="startNewChatBtn">
                        <i class="fas fa-plus"></i> Nuevo Chat
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Pantalla de Chat Individual -->
        <div class="chat-container hidden" id="chatWindow">
            <div class="chat-header">
                <button class="back-btn" id="backToChatsBtn">
                    <i class="fas fa-arrow-left"></i>
                </button>
                
                <div class="chat-user-info">
                    <div class="chat-user-avatar" id="chatUserAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="chat-user-details">
                        <h3 id="chatUserName">Contacto</h3>
                        <p id="chatUserStatus">En línea</p>
                    </div>
                </div>
                
                <div class="chat-header-actions">
                    <button class="header-btn" id="chatVideoCallBtn">
                        <i class="fas fa-video"></i>
                    </button>
                    <button class="header-btn" id="chatAudioCallBtn">
                        <i class="fas fa-phone"></i>
                    </button>
                </div>
            </div>
            
            <!-- Mensajes -->
            <div class="messages-container" id="messagesContainer">
                <div class="message-date">
                    <span>HOY</span>
                </div>
                <!-- Los mensajes se cargarán aquí -->
            </div>
            
            <!-- Input de Mensajes -->
            <div class="message-input-container">
                <button class="input-btn" id="attachBtn">
                    <i class="fas fa-paperclip"></i>
                </button>
                
                <button class="input-btn" id="emojiBtn">
                    <i class="far fa-smile"></i>
                </button>
                
                <div class="message-input">
                    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
                    <div class="input-actions">
                        <button class="record-btn" id="recordBtn">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                </div>
                
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            
            <!-- Modal para adjuntar archivos -->
            <div class="attach-modal hidden" id="attachModal">
                <div class="attach-options">
                    <button class="attach-option" id="attachPhoto">
                        <i class="fas fa-camera"></i>
                        <span>Cámara</span>
                    </button>
                    <button class="attach-option" id="attachGallery">
                        <i class="fas fa-images"></i>
                        <span>Galería</span>
                    </button>
                    <button class="attach-option" id="attachDocument">
                        <i class="fas fa-file"></i>
                        <span>Documento</span>
                    </button>
                    <button class="attach-option" id="attachLocation">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>Ubicación</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Modal Nuevo Chat -->
        <div class="modal hidden" id="newChatModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Nuevo Chat</h3>
                    <button class="close-btn" id="closeNewChatBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="search-users">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchUsers" placeholder="Buscar por nombre...">
                    </div>
                    <div class="users-list" id="usersList">
                        <!-- Usuarios disponibles -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Modal Perfil -->
        <div class="modal hidden" id="profileModal">
            <div class="modal-content profile-modal">
                <div class="modal-header">
                    <h3>Mi Perfil</h3>
                    <button class="close-btn" id="closeProfileBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="profile-avatar-section">
                        <div class="profile-avatar-large" id="profileAvatarLarge">
                            <i class="fas fa-user"></i>
                        </div>
                        <button class="change-photo-btn" id="changePhotoBtn">
                            <i class="fas fa-camera"></i> Cambiar foto
                        </button>
                    </div>
                    
                    <div class="profile-info">
                        <div class="info-item">
                            <label><i class="fas fa-user"></i> Nombre</label>
                            <input type="text" id="profileName" value="Usuario">
                        </div>
                        
                        <div class="info-item">
                            <label><i class="fas fa-phone"></i> Teléfono</label>
                            <input type="text" id="profilePhone" value="+1 234 567 8900">
                        </div>
                        
                        <div class="info-item">
                            <label><i class="fas fa-info-circle"></i> Estado</label>
                            <input type="text" id="profileStatus" placeholder="¿Qué estás pensando?">
                        </div>
                    </div>
                    
                    <button class="btn-primary" id="saveProfileBtn">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                    
                    <button class="btn-logout" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Notificación de nuevo mensaje -->
    <div class="notification hidden" id="notification">
        <div class="notification-content">
            <div class="notification-avatar" id="notificationAvatar">
                <i class="fas fa-user"></i>
            </div>
            <div class="notification-info">
                <h4 id="notificationName">Contacto</h4>
                <p id="notificationMessage">Nuevo mensaje</p>
            </div>
        </div>
    </div>
    
    <!-- Grabación de audio -->
    <div class="audio-recorder hidden" id="audioRecorder">
        <div class="recorder-content">
            <div class="recorder-wave"></div>
            <p class="recorder-timer">0:00</p>
            <div class="recorder-actions">
                <button class="recorder-btn cancel" id="cancelRecording">
                    <i class="fas fa-times"></i>
                </button>
                <button class="recorder-btn send" id="sendRecording">
                    <i class="fas fa-check"></i>
                </button>
            </div>
        </div>
    </div>
    
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
