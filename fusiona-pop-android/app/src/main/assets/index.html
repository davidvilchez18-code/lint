<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

<title>Fusiona Pop v1.4 — frutas redonditas</title>
<style>
:root{--brown:#7b4a35;--cream:#fff7e2;--orange:#ed9d51}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#7a8cb8;font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--brown);overflow:hidden}
body{display:grid;place-items:center}
#app{width:min(100vw,470px);height:min(100dvh,980px);position:relative;overflow:hidden;isolation:isolate;background:#929fca;box-shadow:0 0 40px #35456a30;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:max(16px,env(safe-area-inset-top));left:15px;right:15px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:start;pointer-events:none}
.hud>*{pointer-events:auto}.tile{background:#fff8e8;box-shadow:0 5px 0 #d9bf99,0 7px 18px #4036371a;border:2px solid #f8efce;border-radius:16px}
.next{height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.tiny{font-size:10px;letter-spacing:1.2px;font-weight:900;text-transform:uppercase;color:#996f52}.nextContents{display:flex;align-items:center;gap:8px}.nextIcon{font-size:29px;line-height:1}.score{height:93px;margin-top:9px;display:flex;flex-direction:column;align-items:center;justify-content:center}.score strong{font-size:36px;color:#b35c25;line-height:1.05;font-weight:1000;font-variant-numeric:tabular-nums}.score small{font-size:11px;font-weight:800;color:#9c6c43}.actions{display:flex;justify-content:end;gap:6px}.circle-btn{width:36px;height:36px;border-radius:12px;border:2px solid #fff4ce;background:#fff6dd;box-shadow:0 3px 0 #c7a785;display:grid;place-items:center;font-size:17px;color:#754c37;cursor:pointer}.circle-btn:active,.big-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c7a785}
.subhud{position:absolute;top:max(125px,calc(env(safe-area-inset-top) + 110px));left:18px;right:18px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;font-size:12px;color:#fdf7e9;font-weight:850;text-shadow:0 2px 4px #56638a80}.pill{padding:6px 10px;background:#5d6fa666;border:1px solid #e4e6ff7b;border-radius:100px;backdrop-filter:blur(4px)}
.bottom{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:15px;right:15px;display:grid;gap:10px}.progress{display:flex;align-items:center;justify-content:center;gap:clamp(1px,.7vw,4px);padding:8px 4px;border-radius:16px;background:#fff1dbaa;border:1.5px solid #fae9c3;box-shadow:0 4px 10px #59331f30}.stage{display:flex;gap:5px;align-items:center}.fruitDot{width:clamp(20px,5.9vw,28px);height:clamp(20px,5.9vw,28px);border-radius:50%;display:grid;place-items:center;font-size:clamp(13px,4vw,18px);background:#fff9e9;border:2px solid #fff;box-shadow:0 3px 0 #bd9674}.arrow{font-size:12px;font-weight:1000;color:#8d684e}.burst{color:#b75c48;font-size:9px;white-space:nowrap;font-weight:1000}.options{display:flex;align-items:center;gap:10px;justify-content:space-between}.selectWrap{background:#fff4dd;color:#6e4635;border:2px solid #f8e9bf;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:900;box-shadow:0 3px 0 #c9a47b;display:flex;align-items:center;gap:6px;flex:1}.selectWrap select{color:inherit;background:transparent;border:0;outline:0;font:inherit;flex:1;min-width:0}.mode{font-size:11px;font-weight:750;white-space:nowrap;padding:9px;background:#fff0d5;border:2px solid #f8e9bf;border-radius:12px;box-shadow:0 3px 0 #c9a47b;max-width:55%}.mode select{font-size:11px;font-weight:800;background:transparent;border:0;outline:0;max-width:100%;color:#6e4635}
.toast{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(.86);color:#fffbe8;font-weight:1000;font-size:25px;text-shadow:0 3px 1px #a74c5e,0 4px 9px #4e4d8e;letter-spacing:.4px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.overlay{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:#36345190;backdrop-filter:blur(5px);padding:25px}.overlay.show{display:flex}.panel{border:3px solid #fef0c8;background:#fff9e8;border-radius:26px;padding:24px 19px;box-shadow:0 12px 0 #c99f80,0 25px 45px #35243b44;text-align:center;width:100%;max-width:345px}.panel h1{font-size:28px;margin:4px 0;color:#ba6537}.panel p{font-size:14px;line-height:1.55;color:#7a624e;margin:11px 0 20px}.panel .medal{font-size:55px}.big-btn{border:2px solid #fce8a8;border-radius:16px;background:#ed9953;box-shadow:0 4px 0 #b86a36;color:#fff;cursor:pointer;padding:12px 24px;font-size:17px;font-weight:1000;text-shadow:0 1px 1px #8f4a2f;width:100%}.help{font-size:11px;color:#8c775f;margin-top:15px;font-weight:700}.combo{position:absolute;top:160px;left:50%;transform:translateX(-50%);font-size:19px;font-weight:1000;color:#fff6d5;text-shadow:0 2px 0 #ba6146;opacity:0;pointer-events:none;transition:.22s}.combo.show{opacity:1}
@media(max-height:700px){.hud{top:8px}.subhud{top:103px}.bottom{bottom:5px;gap:6px}.score{height:69px;margin-top:0}.score strong{font-size:27px}.next{height:62px}.progress{padding:5px 3px}.fruitDot{width:21px;height:21px;font-size:14px}.mode,.selectWrap{padding:5px}.combo{top:125px}}
@media(max-width:365px){.progress .burst{display:none}.fruitDot{width:21px;height:21px}.progress{gap:2px}.arrow{font-size:10px}}
@media(max-width:365px){
 .hud{left:9px;right:9px;grid-template-columns:75px 98px minmax(0,1fr);gap:5px}
 .score{height:71px;margin-top:0}.score strong{font-size:25px}
 .next{height:71px}.nextIcon{font-size:24px}
 .actions{gap:2px;justify-content:flex-end;flex-wrap:nowrap}
 .circle-btn{width:27px;min-width:27px;height:30px;font-size:13px;padding:0}
 .bottom{left:8px;right:8px}
 .subhud{left:9px;right:9px;font-size:10px;gap:5px}
 .pill{padding:5px 7px}
}
</style>
</head>

<div id="app">
<canvas id="canvas" aria-label="Recipiente de juego, arrastra y suelta frutas para fusionarlas"></canvas>
<header class="hud">
  <div class="tile next"><span class="tiny">Siguiente</span><div class="nextContents"><span class="nextIcon" id="nextIcon">🍒</span><span class="tiny" id="nextLevel">N1</span></div></div>

  <div class="actions"><button class="circle-btn" id="helpBtn" aria-label="Instrucciones">?</button><button class="circle-btn" id="soundBtn" aria-label="Activar/desactivar sonido">♫</button><button class="circle-btn" id="pauseBtn" aria-label="Pausar juego">Ⅱ</button><button class="circle-btn" id="resetBtn" aria-label="Reiniciar partida">↻</button></div>
</header>
<div class="subhud"><span class="pill">🍇 FUSIONA POP</span><span class="pill">✦ 7 niveles · frutas más claras</span></div>
<div class="combo" id="combo"></div><div id="toast" class="toast">¡POP!</div>
<div class="bottom">
 <div class="progress" id="progress"></div>

</div>
<div class="overlay" id="overlay"><div class="panel"><div class="medal" id="medal">🍉</div><h1 id="overlayTitle">Fusiona Pop</h1><p id="overlayText">Suelta dos objetos iguales para crear uno mayor. Cuando aparezca el nivel 7, ¡POP! desaparece y ganas puntos.</p><button class="big-btn" id="overlayAction">¡A jugar!</button><div class="help">Arrastra y suelta · música nueva · sin internet</div></div></div>
</div>

 else if(f.lvl===5)ctx.ellipse(0,.02*r,r*.86,r*.92,0,0,Math.PI*2);
 else ctx.arc(0,0,r*.9,0,Math.PI*2);
 ctx.fill();ctx.stroke();ctx.shadowBlur=0;glossyArc(r*.9);
 
 if(f.lvl===0){
   // caramelo redondo con envoltura
   ctx.fillStyle='#fff2fb';for(const dir of [-1,1]){ctx.beginPath();ctx.moveTo(dir*r*.82,0);ctx.lineTo(dir*r*1.12,-r*.18);ctx.lineTo(dir*r*1.06,0);ctx.lineTo(dir*r*1.12,r*.18);ctx.closePath();ctx.fill();ctx.stroke();}
   ctx.strokeStyle='#ffd6ee';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*.55,.2,2.8);ctx.stroke();
 }
 else if(f.lvl===1){
   ctx.fillStyle='#8b5d42';for(const [x,y,s] of [[-.35,-.18,.09],[.2,-.27,.08],[-.1,.2,.075],[.33,.2,.07],[.05,.03,.065]]){ctx.beginPath();ctx.arc(x*r,y*r,r*s,0,Math.PI*2);ctx.fill()}
 }
 else if(f.lvl===2){
   // dona circular con hueco y glaseado
   ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(0,0,r*.34,0,Math.PI*2);ctx.fill();ctx.restore();
   ctx.strokeStyle='#6b4850';ctx.lineWidth=Math.max(2,3*(r/40));ctx.beginPath();ctx.arc(0,0,r*.34,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle='#ffd9ea';ctx.beginPath();ctx.arc(0,-r*.03,r*.54,0,Math.PI*2);ctx.fill();
   for(const [x,y,c] of [[-.22,-.2,'#8fd6ff'],[.14,-.1,'#fff38d'],[-.04,.12,'#ff9fb8'],[.26,.14,'#9df58c']]){ctx.strokeStyle=c;ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(x*r-r*.03,y*r-r*.02);ctx.lineTo(x*r+r*.03,y*r+r*.02);ctx.stroke();}
 }
 else if(f.lvl===3){
   // bombón/chocolate circular
   ctx.strokeStyle='#7a4d46aa';ctx.lineWidth=r*.06;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*r*.2,-r*.52);ctx.lineTo(i*r*.2,r*.52);ctx.stroke();}
   ctx.strokeStyle='#b5816e66';ctx.beginPath();ctx.arc(0,0,r*.52,.4,2.8);ctx.stroke();
 }
 else if(f.lvl===4){
   // cupcake redondito
   ctx.fillStyle='#f4ddff';ctx.beginPath();ctx.arc(0,-r*.1,r*.48,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#c494ff55';ctx.beginPath();ctx.arc(-r*.12,-r*.18,r*.18,0,Math.PI*2);ctx.arc(r*.12,-r*.08,r*.14,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#e7b391';ctx.beginPath();ctx.moveTo(-r*.36,r*.45);ctx.lineTo(r*.36,r*.45);ctx.lineTo(r*.26,r*.8);ctx.lineTo(-r*.26,r*.8);ctx.closePath();ctx.fill();ctx.stroke();
 }
 else if(f.lvl===5){
   // helado/copa circular
   ctx.fillStyle='#fff3cf';ctx.beginPath();ctx.arc(0,-r*.08,r*.44,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#e9b7bf';ctx.beginPath();ctx.arc(r*.16,-r*.2,r*.15,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#efd6b3';ctx.beginPath();ctx.moveTo(-r*.24,r*.4);ctx.lineTo(r*.24,r*.4);ctx.lineTo(r*.08,r*.82);ctx.lineTo(-r*.08,r*.82);ctx.closePath();ctx.fill();ctx.stroke();
 }
 else if(f.lvl===6){
   // tarta circular tipo pastel
   ctx.fillStyle='#fff3db';ctx.beginPath();ctx.arc(0,0,r*.76,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#ffb7d2';ctx.beginPath();ctx.arc(0,-r*.06,r*.62,0,Math.PI*2);ctx.fill();ctx.stroke();
   ctx.fillStyle='#fff';for(let i=0;i<7;i++){let a=i*Math.PI*2/7;ctx.beginPath();ctx.arc(Math.cos(a)*r*.42,Math.sin(a)*r*.34-r*.06,r*.07,0,Math.PI*2);ctx.fill();}
 }
 drawFace(0,f.lvl===4?0:r*.05,r*.8);
 ctx.restore();
}

function fruitDraw(f,alpha=1){if(type==='fruit')return drawFruitPiece(f,alpha);if(type==='space')return drawSpacePiece(f,alpha);return drawSweetPiece(f,alpha)}
function background(){const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#8196c6');bg.addColorStop(.7,'#a2b1d1');bg.addColorStop(1,'#b6a18c');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let i=0;i<12;i++){let xx=29+(i*89)%399,yy=70+(i*115)%620;ctx.globalAlpha=.11+Math.sin(elapsed*.8+i)*.07;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(xx,yy,2.7,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 ctx.fillStyle='#eadca8';ctx.beginPath();ctx.moveTo(L,TOP+20);ctx.lineTo(L+29,TOP);ctx.lineTo(R-29,TOP);ctx.lineTo(R,TOP+20);ctx.lineTo(R,BOTTOM);ctx.lineTo(L,BOTTOM);ctx.closePath();ctx.fill();ctx.fillStyle='#e3d4b1';ctx.fillRect(L,TOP+28,R-L,BOTTOM-TOP-28);ctx.fillStyle='#e5d6b5b0';ctx.beginPath();ctx.moveTo(L,TOP+24);ctx.lineTo(L+29,TOP);ctx.lineTo(R-29,TOP);ctx.lineTo(R,TOP+24);ctx.closePath();ctx.fill();ctx.strokeStyle='#fffde3';ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(L,TOP+25);ctx.lineTo(L+29,TOP);ctx.lineTo(R-29,TOP);ctx.lineTo(R,TOP+25);ctx.lineTo(R,BOTTOM);ctx.lineTo(L,BOTTOM);ctx.closePath();ctx.stroke();
 ctx.save();ctx.setLineDash([9,8]);ctx.strokeStyle=dangerTime>0?'#ef6672':'#e88f7b8c';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(L+2,DANGER);ctx.lineTo(R-2,DANGER);ctx.stroke();ctx.restore();
 if(state==='play'){let preview=spawnPreview();ctx.save();ctx.setLineDash([9,10]);ctx.strokeStyle='#fff8d7b8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(dragX,TOP-20);ctx.lineTo(dragX,BOTTOM-5);ctx.stroke();ctx.restore();fruitDraw(preview,.72)}
 }
function spawnPreview(){return {x:clamp(dragX,L+sets[type][next].r,R-sets[type][next].r),y:TOP-34,r:sets[type][next].r,lvl:next}}
function foreground(){ctx.fillStyle='#fff8d42e';ctx.fillRect(L+4,TOP+28,6,BOTTOM-TOP-33);ctx.fillStyle='#ffffff16';ctx.fillRect(R-14,TOP+30,7,BOTTOM-TOP-36);ctx.strokeStyle='#fffce1a8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,TOP+26);ctx.lineTo(R,TOP+26);ctx.stroke();ctx.fillStyle='#c49b71';ctx.fillRect(0,BOTTOM+8,W,H-BOTTOM);const floor=ctx.createLinearGradient(0,BOTTOM,0,H);floor.addColorStop(0,'#cda77d');floor.addColorStop(1,'#b88b68');ctx.fillStyle=floor;ctx.fillRect(0,BOTTOM+10,W,H-BOTTOM);ctx.fillStyle='#936e567f';ctx.fillRect(0,BOTTOM+7,W,8);ctx.fillStyle='#e5bc90';ctx.fillRect(0,BOTTOM+15,W,3);ctx.fillStyle='#815b4870';ctx.fillRect(0,H-72,W,2)}
function draw(){ctx.clearRect(0,0,W,H);background();for(const f of fruits){if(f.y>TOP-100)fruitDraw(f)}for(const p of particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.translate(p.x,p.y);ctx.rotate(p.turn+p.life*6);roundRect(-p.r/2,-p.r/2,p.r,p.r,.9);ctx.fill();ctx.restore()}foreground();if(dangerTime>0){ctx.save();ctx.globalAlpha=Math.min(.65,dangerTime/3);ctx.fillStyle='#e96275';ctx.font='1000 15px system-ui';ctx.textAlign='center';ctx.fillText('¡Cuidado, se está llenando!',W/2,DANGER-12);ctx.restore()}}
let last=performance.now(),acc=0;
function tick(now){let dt=Math.min((now-last)/1000,.05);last=now;elapsed+=dt;if(state==='play'){acc+=dt;let loops=0;while(acc>1/90&&loops<5){physics(1/90);acc-=1/90;loops++}}draw();if(toastUntil&&now>toastUntil){$('toast').classList.remove('show');toastUntil=0}requestAnimationFrame(tick)}
function toWorld(ev){let rect=canvas.getBoundingClientRect();return {x:(ev.clientX-rect.left)*W/rect.width,y:(ev.clientY-rect.top)*H/rect.height}}
canvas.addEventListener('pointerdown',e=>{if(state!=='play'||cooldown>0)return;let p=toWorld(e);if(p.y<TOP-65||p.y> BOTTOM+15)return;dragging=true;dragX=clamp(p.x,L+sets[type][next].r,R-sets[type][next].r);canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(state!=='play')return;let p=toWorld(e);if(dragging||p.y>TOP-65){dragX=clamp(p.x,L+sets[type][next].r,R-sets[type][next].r)}});
canvas.addEventListener('pointerup',e=>{if(!dragging)return;let p=toWorld(e);dragX=clamp(p.x,L+sets[type][next].r,R-sets[type][next].r);drop();e.preventDefault()});
canvas.addEventListener('pointercancel',()=>{dragging=false});
function pause(){if(state==='play'){pauseMusic();state='paused';$('pauseBtn').textContent='▶';showOverlay('Pausa','La fruta no se moverá hasta que continúes.','⏸️','Continuar')}else if(state==='paused'){state='play';startMusic();$('pauseBtn').textContent='Ⅱ';$('overlay').classList.remove('show')}}
$('pauseBtn').addEventListener('click',pause);
$('overlayAction').addEventListener('click',()=>{if(state==='paused'){pause()}else{reset()}});
$('resetBtn').addEventListener('click',()=>{reset()});
$('helpBtn').addEventListener('click',()=>{pauseMusic();state='paused';$('pauseBtn').textContent='▶';showOverlay('Cómo jugar','Arrastra el dedo hasta donde quieras dejar caer un objeto. Junta dos iguales para subir de nivel, hasta el nivel 7. Por defecto, el nivel 7 desaparece con una explosión de puntos. ¡Evita llenar el recipiente!','✨','Entendido')});
$('soundBtn').addEventListener('click',()=>{sound=!sound;storage.setItem('fusion-sound',sound?'on':'off');$('soundBtn').textContent=sound?'♫':'♪̸';if(sound){if(state==='play')startMusic();sfx(600,.06)}else pauseMusic()});
$('themeSelect').addEventListener('change',e=>{type=e.target.value;storage.setItem('fusion-theme',type);reset()});
$('popMode').addEventListener('change',e=>{mode=e.target.value;storage.setItem('fusion-mode',mode);reset()});
setProgress();selectNext();showOverlay('Fusiona Pop','Suelta dos objetos iguales para crear uno mayor. Al llegar al nivel 7, se convierten en puntos y desaparecen. Puedes cambiar las reglas y el tema cuando quieras.','🍉','¡A jugar!');requestAnimationFrame(tick);
})();
</script>
