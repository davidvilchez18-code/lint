<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Linterna Pro</title>
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .flashlight-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .flashlight-on {
            background-color: white !important;
        }
        
        .flashlight-off {
            background-color: #000 !important;
        }
        
        .torch-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.5),
                inset 0 -8px 16px rgba(0,0,0,0.8),
                inset 0 8px 16px rgba(255,255,255,0.1);
            position: relative;
            transition: all 0.3s ease;
            margin-bottom: 40px;
        }
        
        .torch-button:active {
            transform: scale(0.95);
        }
        
        .torch-button.on {
            background: linear-gradient(145deg, #fff8c4, #ffeb3b);
            box-shadow: 
                0 0 60px #ffeb3b,
                0 0 100px rgba(255, 235, 59, 0.5),
                inset 0 -8px 16px rgba(255, 200, 0, 0.8),
                inset 0 8px 16px rgba(255, 255, 255, 0.8);
        }
        
        .torch-icon {
            font-size: 70px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .torch-button.on .torch-icon {
            color: #000;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
        
        .torch-button:not(.on) .torch-icon {
            color: #666;
        }
        
        .status-text {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .controls {
            padding: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-button {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        
        .control-button:active {
            transform: scale(0.95);
        }
        
        .control-button i {
            font-size: 20px;
        }
        
        .permission-alert {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            text-align: center;
        }
        
        .permission-alert.hidden {
            display: none;
        }
        
        .alert-content {
            max-width: 300px;
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .alert-content h2 {
            margin-bottom: 15px;
            color: #ffeb3b;
        }
        
        .alert-content p {
            margin-bottom: 25px;
            line-height: 1.5;
            color: #ccc;
        }
        
        .alert-button {
            padding: 15px 30px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        
        .sos-button {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ff3b30;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 59, 48, 0.4);
        }
        
        .sos-active {
            animation: sosBlink 1s infinite;
        }
        
        @keyframes sosBlink {
            0%, 100% { background: #ff3b30; }
            50% { background: #000; }
        }
        
        .battery-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #888;
        }
        
        @media (max-width: 768px) {
            .torch-button {
                width: 180px;
                height: 180px;
            }
            
            .torch-icon {
                font-size: 60px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="flashlight-area" id="flashlightArea">
        <button class="torch-button" id="torchButton">
            <div class="torch-icon">🔦</div>
            <div class="status-text" id="statusText">APAGADO</div>
        </button>
        
        <div class="battery-indicator" id="batteryIndicator">
            <i class="fas fa-battery-full"></i>
            <span id="batteryLevel">--%</span>
        </div>
    </div>
    
    <div class="controls">
        <button class="control-button" id="strobeButton">
            <i class="fas fa-bolt"></i>
            <span>Strobe</span>
        </button>
        <button class="control-button" id="morseButton">
            <i class="fas fa-code"></i>
            <span>SOS</span>
        </button>
        <button class="control-button" id="brightnessButton">
            <i class="fas fa-sun"></i>
            <span>Brillo</span>
        </button>
    </div>
    
    <button class="sos-button" id="sosButton">SOS</button>
    
    <div class="permission-alert" id="permissionAlert">
        <div class="alert-content">
            <h2>🔄 Permiso Requerido</h2>
            <p>Para usar la linterna, necesitamos acceso a la cámara de tu dispositivo.</p>
            <p><strong>No grabaremos ni tomaremos fotos, solo controlaremos la linterna.</strong></p>
            <button class="alert-button" id="requestPermissionBtn">Permitir Acceso</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
